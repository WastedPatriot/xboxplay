appId: com.wastedpatriot.xboxplay
productName: XboxPlay
asar: true
publish: null
files:
  - src/**/*
  - assets/**/*
  - keymap.example.json
  - package.json
  - LICENSE
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Game
  icon: assets/icon.png
  executableName: xboxplay
  syncDesktopName: true
  synopsis: Xbox remote play and cloud gaming
  maintainer: WastedPatriot
  desktop:
    entry:
      Name: XboxPlay
      GenericName: Xbox remote play
      Keywords: xbox;cloud;gaming;remote;play;
      StartupWMClass: XboxPlay
      Terminal: "false"
      StartupNotify: "true"
      Type: Application
