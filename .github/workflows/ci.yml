name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh test/install-idempotent.sh
      - name: node --check
        run: for f in src/*.js test/*.js scripts/*.js; do node --check "$f"; done
      - name: unit tests
        run: node test/unit.js
      - name: install script is idempotent
        run: bash test/install-idempotent.sh
      - name: lockfile is in sync
        run: npm ci --ignore-scripts --no-audit --no-fund
