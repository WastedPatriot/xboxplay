# Build from a checkout of this repo:
#   flatpak-builder --user --install --force-clean build-dir flatpak/com.wastedpatriot.XboxPlay.yml
# Needs org.freedesktop.Platform//25.08, the matching SDK, and org.freedesktop.Sdk.Extension.node22.
app-id: com.wastedpatriot.XboxPlay
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: xboxplay
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=all
build-options:
  build-args:
    - --share=network
modules:
  - name: xboxplay
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        NPM_CONFIG_AUDIT: "false"
        NPM_CONFIG_FUND: "false"
    build-commands:
      - npm ci --no-audit --no-fund
      - mkdir -p /app/lib/xboxplay
      - cp -a src assets package.json node_modules /app/lib/xboxplay/
      - install -Dm755 flatpak/xboxplay.sh /app/bin/xboxplay
      - install -Dm644 flatpak/com.wastedpatriot.XboxPlay.desktop /app/share/applications/com.wastedpatriot.XboxPlay.desktop
      - install -Dm644 assets/icons/16x16.png /app/share/icons/hicolor/16x16/apps/com.wastedpatriot.XboxPlay.png
      - install -Dm644 assets/icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.wastedpatriot.XboxPlay.png
      - install -Dm644 assets/icons/48x48.png /app/share/icons/hicolor/48x48/apps/com.wastedpatriot.XboxPlay.png
      - install -Dm644 assets/icons/64x64.png /app/share/icons/hicolor/64x64/apps/com.wastedpatriot.XboxPlay.png
      - install -Dm644 assets/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.wastedpatriot.XboxPlay.png
      - install -Dm644 assets/icons/256x256.png /app/share/icons/hicolor/256x256/apps/com.wastedpatriot.XboxPlay.png
      - install -Dm644 assets/icons/512x512.png /app/share/icons/hicolor/512x512/apps/com.wastedpatriot.XboxPlay.png
    sources:
      - type: dir
        path: ..
